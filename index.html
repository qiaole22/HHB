<script>
const CATS=[["wohnung","Wohnung / Internet / Fernsehen"],["transport","Transport"],["sport","Entertainment / Sport"],["kleidung","Kleidung / Körperpflege / Gesundheit"],["food","Lebensmittel"],["rest","Restaurants"],["out","Ausgehen / Freizeit"],["geschenke","Geschenke"],["urlaub","Urlaub"]];

function list(e,i){const all=[...e.map(x=>({...x,k:'e'})),...i.map(x=>({...x,k:'i',d:x.d||1}))].sort((a,b)=>b.d-a.d||b.u-a.u);

return h+'<tr class="ft"><th></th>'+CATS.map(c=>`<td></td><td class="n">${sm(e.filter(x=>x.c==c[0])).toFixed(2)}</td>`).join('')+`<td class="n">${tot.toFixed(2)}</td><td></td><td></td></tr></table></div>`}

function acc(){const v=ACC.map(k=>S.s[month+'|'+k]?.a||0),t=v.reduce((p,x)=>p+x,0),pm=pmo(-1),has=ACC.some(k=>S.s[pm+'|'+k]),pt=ACC.reduce((p,k)=>p+(S.s[pm+'|'+k]?.a||0),0);

$('v').innerHTML=({o:()=>(cfg.token?'':'<div class="card" data-sync="1" style="cursor:pointer">☁️ Auf allen Geräten nutzen – hier tippen</div>')+over(e,i),l:()=>'<div class="card">'+list(e,i)+'</div>',t:()=>table(e),k:acc})[view]()}
function openSheet(o={}){sh={id:'',type:'e',amt:'',c:'food',date:month==ds(0).slice(0,7)?ds(0):month+'-01',t:'',...o};draw();$('ov').classList.add('on')}
function draw(){$('sheet').innerHTML=`<div class="sg"><button data-type="e" class="${sh.type=='e'?'on':''}">Ausgabe</button><button data-type="i" class="${sh.type=='i'?'on':''}">Einnahme</button></div><div class="amt">${sh.amt||'0'} €</div>`
+(sh.type=='e'?'<div class="cg">'+CATS.map(c=>`<button data-cat="${c[0]}" class="${sh.c==c[0]?'on':''}"><span>${EM[c[0]]}</span>${SH[c[0]]}</button>`).join('')+'</div>':'')
+`<div class="dr"><button data-dd="0" class="${sh.date==ds(0)?'on':''}">Heute</button><button data-dd="1" class="${sh.date==ds(1)?'on':''}">Gestern</button><input type="date" value="${sh.date}"></div><input id="sn" placeholder="Notiz (optional)" value="${esc(sh.t)}">`
+'<div class="pad">'+['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')+`</div><div class="ac">${sh.id?'<button id="sdel">🗑</button>':''}<button id="sok">Speichern</button></div>`}
function commit(){const a=parseFloat(sh.amt.replace(',','.'));if(!(a>0))return;const u=Date.now(),[y,m,d]=sh.date.split('-'),id=uid(),mk=y+'-'+m,t=$('sn').value.trim();

if(sh.type=='i')S.i[id]={id,m:mk,d:+d,t:t||'Einnahme',a,u};else S.e[id]={id,m:mk,d:+d,c:sh.c,t,a,u};

$('sheet').oninput=ev=>{if(ev.target.id=='sn')sh.t=ev.target.value};

else if(d.k){let a=sh.amt;if(d.k=='⌫')a=a.slice(0,-1);else if(d.k==','){if(!a.includes(','))a=(a||'0')+','}else if(a.length<9&&!(a.includes(',')&&a.split(',')[1].length>=2))a=(a=='0'?'':a)+d.k;sh.amt=a}

else if(b.id=='sdel'){const o=S.e[sh.id]||S.i[sh.id];o.x=1;o.u=Date.now();$('ov').classList.remove('on');return save()}else return;draw()};
$('ov').onclick=ev=>{if(ev.target.id=='ov')$('ov').classList.remove('on')};$('add').onclick=()=>openSheet();

document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
$('pm').onclick=()=>{month=pmo(-1);render()};$('nm').onclick=()=>{month=pmo(1);render()};
// ---- Sync (GitHub-Repo als Speicher) ----
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

function merge(R){for(const t of['e','i','s'])for(const k in R[t]||{})if(!S[t][k]||R[t][k].u>S[t][k].u)S[t][k]=R[t][k]}
async function sync(n=0){if(!cfg.token)return;$('sy').textContent='…';

if(txt!=rt){const p=await gh('PUT',{message:'sync',content:enc(txt),sha});if((p.status==409||p.status==422)&&n<3)return sync(n+1);if(!p.ok)throw p.status}

async function setup(){if(cfg.repo)return;const H={Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},A='https://api.github.com/';

if(r.status==404){const c=await fetch(A+'user/repos',{method:'POST',headers:H,body:JSON.stringify({name:n,private:true,auto_init:true,description:'Haushaltsbuch Daten'})});if(!c.ok)throw c.status}else if(!r.ok)throw r.status;

function dlg(){$('dg').innerHTML=cfg.token?`<p><b>✓ Verbunden</b><br><small>${esc(cfg.repo||'')}</small></p><button class="pri" id="d1">Jetzt synchronisieren</button><button id="d2">📱 Anderes Gerät koppeln</button><button id="d3">Trennen</button><button id="d0">Schließen</button>`:`<p><b>☁️ Synchronisieren</b></p><p>1. <a href="https://github.com/settings/tokens/new?scopes=repo&description=Haushaltsbuch" target="_blank">Token erstellen</a> – unten „Generate token“ tippen und den Token kopieren.</p><p>2. Hier einfügen:</p><input id="gt" placeholder="ghp_…"><button class="pri" id="d4">Verbinden</button><button id="d0">Schließen</button>`}

else if(i=='d2'){const l=location.origin+location.pathname+'#k='+cfg.token;if(navigator.share)navigator.share({url:l,title:'Haushaltsbuch'}).catch(()=>{});else{await navigator.clipboard.writeText(l);alert('Link kopiert – auf dem anderen Gerät öffnen.')}}

// ---- Excel-Export im Layout der Vorlage ----
$('ex').onclick=async()=>{const[y,m]=month.split('-'),n=new Date(y,m,0).getDate(),e=E(),ic=I(),wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(month);
const col=c=>ws.getColumn(c).letter,fl=r=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+r}}),EU='#,##0.00\\ [$€-1];[Red]\\-#,##0.00\\ [$€-1]',
hd=(r,c,v,bg)=>{const z=ws.getCell(r,c);z.value=v;z.fill=fl(bg);z.font={bold:true,color:{argb:'FFFFFFFF'}};z.alignment={wrapText:true,horizontal:'center',vertical:'middle'}},

['Daily Total','Remaining','Total Spent'].forEach((v,i)=>{hd(1,20+i,v,'596984');ws.getColumn(20+i).width=13});
